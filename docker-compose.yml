services:
  postgres:
    image: postgres:18-alpine
    container_name: greenroots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-greenroots_farm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command:
      [
        "postgres",
        "-c",
        "max_connections=150",
        "-c",
        "shared_buffers=128MB",
        "-c",
        "work_mem=16MB",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-greenroots_farm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - greenroots-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:8-alpine
    container_name: greenroots-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command:
      [
        "redis-server",
        "--maxclients",
        "10000",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - greenroots-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

volumes:
  pgdata:
  redisdata:

networks:
  greenroots-net:
    driver: bridge
