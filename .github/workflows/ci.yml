name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Check workspace manifest versions
        run: bun run version:check

  shared-package:
    name: Shared and Tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Check formatting
        run: bun run format:check

      - name: Check package manifests
        run: bunx syncpack lint

      - name: Type check shared contracts
        run: bun run check-types:shared

      - name: Type check repository scripts
        run: bun run check-types:scripts

      - name: Type check shared UI
        run: bun run check-types:ui

      - name: Lint shared UI
        run: bun run lint:ui

      - name: Test shared contracts
        run: bun run test:shared

      - name: Test repository scripts
        run: bun run test:scripts

  database:
    name: Migrations and Seed
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services: &services-db-redis
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: greenroots_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d greenroots_farm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &env-db-redis
      DB_URL: postgresql://postgres:postgrespassword@localhost:5432/greenroots_farm
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Apply migrations
        working-directory: apps/api
        run: bun run db:migrate

      - name: Verify migration snapshots are current
        run: |
          cd apps/api
          bun run db:generate
          cd ../..
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::Drizzle snapshots are out of date; run bun run db:generate locally."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      - name: Seed the database
        working-directory: apps/api
        run: bun run db:seed --clean

  api:
    name: API
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services: *services-db-redis
    env: *env-db-redis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the API
        run: bun run check-types:api

      - name: Lint the API
        run: bun run lint:api

      - name: Test the API (Unit & E2E)
        run: bun run test:api && bun run test:e2e

      - name: Build the API
        working-directory: apps/api
        run: bun run build

  storefront:
    name: Storefront
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the Storefront
        run: bun run check-types:storefront

      - name: Lint the Storefront
        run: bun run lint:storefront

      - name: Test the Storefront
        run: bun run test:storefront

      - name: Build the Storefront
        working-directory: apps/storefront
        run: bun run build

  backoffice:
    name: Backoffice
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the Backoffice
        run: bun run check-types:backoffice

      - name: Lint the Backoffice
        run: bun run lint:backoffice

      - name: Test the Backoffice
        run: bun run test:backoffice

      - name: Build the Backoffice
        working-directory: apps/backoffice
        run: bun run build

  backlog-split:
    name: Backlog Split
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Reject pull requests that close a needs-split issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request payload; nothing to check.");
              return;
            }

            const { owner, repo } = context.repo;
            const body = pr.body ?? "";
            const CLOSING = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(CLOSING)].map((match) => Number(match[1])))];

            if (numbers.length === 0) {
              core.info("No closing references found.");
              return;
            }

            const offenders = [];
            for (const number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: number,
                });
                if (issue.pull_request) continue;
                const labels = issue.labels.map((label) =>
                  typeof label === "string" ? label : label.name,
                );
                if (labels.includes("needs-split")) {
                  offenders.push(`#${number} ${issue.title}`);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (offenders.length === 0) {
              core.info("No needs-split issues are closed by this pull request.");
              return;
            }

            core.setFailed(
              [
                "This pull request closes an issue that still bundles multiple concerns:",
                ...offenders.map((entry) => `  - ${entry}`),
                "",
                "Split it first: create atomic children, link them to the epic, close the parent as 'not planned', and resolve the children instead.",
                "See docs/standards/issue-tracker.md -> Issue Atomicity & Backlog Splitting.",
              ].join("\n"),
            );

  quality-gate:
    name: Quality Gate
    needs:
      [
        version-consistency,
        shared-package,
        api,
        storefront,
        backoffice,
        database,
        backlog-split,
      ]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm every gate passed
        env:
          VERSION: ${{ needs.version-consistency.result }}
          SHARED: ${{ needs.shared-package.result }}
          API: ${{ needs.api.result }}
          STOREFRONT: ${{ needs.storefront.result }}
          BACKOFFICE: ${{ needs.backoffice.result }}
          DATABASE: ${{ needs.database.result }}
          BACKLOG: ${{ needs.backlog-split.result }}
        run: |
          failed=0
          for entry in "version-consistency:$VERSION" "shared-package:$SHARED" "api:$API" "storefront:$STOREFRONT" "backoffice:$BACKOFFICE" "database:$DATABASE" "backlog-split:$BACKLOG"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name} did not succeed (${result})"
              failed=1
            fi
          done
          exit "${failed}"
