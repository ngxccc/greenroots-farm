name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      run_all: ${{ steps.scope.outputs.run_all }}
      version_consistency: ${{ steps.scope.outputs.version_consistency }}
      shared_package: ${{ steps.scope.outputs.shared_package }}
      format_check: ${{ steps.scope.outputs.format_check }}
      syncpack: ${{ steps.scope.outputs.syncpack }}
      shared_checks: ${{ steps.scope.outputs.shared_checks }}
      ui_checks: ${{ steps.scope.outputs.ui_checks }}
      scripts_checks: ${{ steps.scope.outputs.scripts_checks }}
      tailwind: ${{ steps.scope.outputs.tailwind }}
      api: ${{ steps.scope.outputs.api }}
      database: ${{ steps.scope.outputs.database }}
      storefront: ${{ steps.scope.outputs.storefront }}
      backoffice: ${{ steps.scope.outputs.backoffice }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          cache: "false"

      - name: Compute CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            bun scripts/ci-scope.ts --base "${BASE_SHA}" --head HEAD >> "${GITHUB_OUTPUT}"
          else
            bun scripts/ci-scope.ts --all >> "${GITHUB_OUTPUT}"
          fi

  version-consistency:
    name: Version Consistency
    needs: changes
    if: needs.changes.outputs.version_consistency == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Check workspace manifest versions
        run: bun run version:check

  shared-package:
    name: Shared and Tooling
    needs: changes
    if: needs.changes.outputs.shared_package == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Check formatting
        if: needs.changes.outputs.format_check == 'true'
        run: bun run format:check

      - name: Check package manifests
        if: needs.changes.outputs.syncpack == 'true'
        run: bunx syncpack lint

      - name: Type check shared contracts
        if: needs.changes.outputs.shared_checks == 'true'
        run: bun run check-types:shared

      - name: Type check repository scripts
        if: needs.changes.outputs.scripts_checks == 'true'
        run: bun run check-types:scripts

      - name: Type check shared UI
        if: needs.changes.outputs.ui_checks == 'true'
        run: bun run check-types:ui

      - name: Lint shared UI
        if: needs.changes.outputs.ui_checks == 'true'
        run: bun run lint:ui

      - name: Check Tailwind CSS v4 canonical classes
        if: needs.changes.outputs.tailwind == 'true'
        run: bun run check:tailwind

      - name: Test shared contracts
        if: needs.changes.outputs.shared_checks == 'true'
        run: bun run test:shared

      - name: Test repository scripts
        if: needs.changes.outputs.scripts_checks == 'true'
        run: bun run test:scripts

  database:
    name: Migrations and Seed
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services: &services-db-redis
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: greenroots_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d greenroots_farm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &env-db-redis
      DB_URL: postgresql://postgres:postgrespassword@localhost:5432/greenroots_farm
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Apply migrations
        working-directory: apps/api
        run: bun run db:migrate

      - name: Verify migration snapshots are current
        run: |
          cd apps/api
          bun run db:generate
          cd ../..
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::Drizzle snapshots are out of date; run bun run db:generate locally."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      - name: Seed the database
        working-directory: apps/api
        run: bun run db:seed --clean

  api-static:
    name: API Static & Unit
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the API
        run: bun run check-types:api

      - name: Lint the API
        run: bun run lint:api

      - name: Unit test the API
        run: bun run test:api

      - name: Build the API
        working-directory: apps/api
        run: bun run build

  api-e2e:
    name: API E2E
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services: *services-db-redis
    env: *env-db-redis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: E2E test the API
        run: bun run test:e2e

  storefront:
    name: Storefront
    needs: changes
    if: needs.changes.outputs.storefront == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the Storefront
        run: bun run check-types:storefront

      - name: Lint the Storefront
        run: bun run lint:storefront

      - name: Test the Storefront
        run: bun run test:storefront

      - name: Build the Storefront
        working-directory: apps/storefront
        run: bun run build

  backoffice:
    name: Backoffice
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Type check the Backoffice
        run: bun run check-types:backoffice

      - name: Lint the Backoffice
        run: bun run lint:backoffice

      - name: Test the Backoffice
        run: bun run test:backoffice

      - name: Build the Backoffice
        working-directory: apps/backoffice
        run: bun run build

  quality-gate:
    name: Quality Gate
    needs:
      [
        changes,
        version-consistency,
        shared-package,
        api-static,
        api-e2e,
        storefront,
        backoffice,
        database,
      ]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm every gate passed
        env:
          CHANGES: ${{ needs.changes.result }}
          VERSION: ${{ needs.version-consistency.result }}
          SHARED: ${{ needs.shared-package.result }}
          API_STATIC: ${{ needs.api-static.result }}
          API_E2E: ${{ needs.api-e2e.result }}
          STOREFRONT: ${{ needs.storefront.result }}
          BACKOFFICE: ${{ needs.backoffice.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          failed=0
          echo "changes: ${CHANGES}"
          if [ "${CHANGES}" != "success" ]; then
            echo "::error::changes did not succeed (${CHANGES})"
            failed=1
          fi
          for entry in "version-consistency:$VERSION" "shared-package:$SHARED" "api-static:$API_STATIC" "api-e2e:$API_E2E" "storefront:$STOREFRONT" "backoffice:$BACKOFFICE" "database:$DATABASE"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::${name} did not succeed (${result})"
              failed=1
            fi
          done
          exit "${failed}"
