name: "PR Area Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-area-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Area Labeler
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release):') &&
      !startsWith(github.event.pull_request.head.ref, 'chore/release-')
    runs-on: ubuntu-22.04
    steps:
      - name: Label
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
