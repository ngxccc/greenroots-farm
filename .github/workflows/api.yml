name: Deploy API

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"
          doppler: "true"
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Run Drizzle migrations
        run: bun run --cwd apps/api doppler:db:migrate

  deploy:
    name: Build & Deploy API to Botkeep
    needs: migrate
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - name: Build API
        run: bun run --cwd apps/api build

      - name: Package standalone API artifact
        run: bun scripts/package-api.ts --out "${{ runner.temp }}/greenroots-api-stage"

      - name: Archive API bundle
        working-directory: ${{ runner.temp }}/greenroots-api-stage
        run: zip -r "${{ runner.temp }}/greenroots-api.zip" dist vendor package.json

      - name: Upload, extract, and restart on Botkeep
        env:
          BOTKEEP_API_KEY: ${{ secrets.BOTKEEP_API_KEY }}
          BOTKEEP_WORKLOAD_ID: ${{ secrets.BOTKEEP_WORKLOAD_ID }}
        run: bun scripts/deploy-botkeep.ts --zip "${{ runner.temp }}/greenroots-api.zip"
