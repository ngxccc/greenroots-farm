name: Backlog Digest

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog-digest
  cancel-in-progress: true

jobs:
  digest:
    name: Refresh Split Register
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Update the split register comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARKER = "<!-- needs-split-digest -->";

            const trackingCandidates = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "area:docs",
              per_page: 100,
            });
            const tracking = trackingCandidates.find(
              (item) =>
                !item.pull_request &&
                item.title.startsWith("chore(issues): track staged split backlog"),
            );

            if (!tracking) {
              core.setFailed(
                "Open tracking issue 'chore(issues): track staged split backlog' was not found. Create it before relying on the register.",
              );
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "needs-split",
              per_page: 100,
            });

            const bundles = issues
              .filter((issue) => !issue.pull_request)
              .sort((left, right) => left.number - right.number);

            const timestamp = new Date().toISOString().replace("T", " ").slice(0, 16);
            const body = [
              MARKER,
              "### Needs-split digest",
              "",
              `Last refreshed: ${timestamp} UTC`,
              "",
              bundles.length === 0
                ? "The register is empty. Close this tracking issue."
                : `**${bundles.length} deferred bundle(s)** still need a split. Drain the batch that matches the milestone you are opening; split it, link the children to the epic, close the parent as \`not planned\`, then remove the label.`,
              "",
              ...bundles.map((issue) => `- #${issue.number} ${issue.title}`),
              "",
              "_Updated automatically by `.github/workflows/backlog-digest.yml`. Do not edit this comment._",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: tracking.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => typeof comment.body === "string" && comment.body.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated digest comment ${existing.id} on #${tracking.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: tracking.number,
                body,
              });
              core.info(`Created digest comment on #${tracking.number}.`);
            }
