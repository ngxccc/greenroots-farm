name: Labels

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  area:
    name: Area Labels
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release):') &&
      !startsWith(github.event.pull_request.head.ref, 'chore/release-')
    runs-on: ubuntu-22.04
    steps:
      - name: Sync area labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  type:
    name: Type Label
    runs-on: ubuntu-22.04
    steps:
      - name: Sync type label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const PREFIX_TO_LABEL = {
              feat: "type:feat",
              fix: "type:fix",
              perf: "type:perf",
              refactor: "type:refactor",
              docs: "type:docs",
              test: "type:test",
              task: "type:task",
              ci: "type:ci",
              chore: "type:chore",
              build: "type:chore",
              style: "type:style",
              core: "type:refactor",
              security: "type:fix",
            };
            const MANAGED = new Set(Object.values(PREFIX_TO_LABEL));

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const current = pr.labels.map((label) => label.name);

            // Keep exactly one primary type label in sync with the PR title.
            const match = /^(\w+)(?:\([^)]*\))?!?:/.exec(pr.title);
            const wanted = match && PREFIX_TO_LABEL[match[1].toLowerCase()];

            if (!wanted) {
              core.info(`"${pr.title}" has no conventional prefix; leaving type labels alone.`);
              return;
            }

            for (const name of current) {
              if (!MANAGED.has(name) || name === wanted) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name,
                });
                core.info(`Removed ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [wanted],
              });
              core.info(`Added ${wanted}`);
            }
