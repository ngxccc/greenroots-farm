changelog:
  exclude:
    labels:
      - dependencies
      - github_actions
  categories:
    - title: Features
      labels:
        - type:feat
        - enhancement
    - title: Bug Fixes
      labels:
        - type:fix
        - type:bug
        - bug
    - title: Performance
      labels:
        - type:perf
    - title: Refactors
      labels:
        - type:refactor
    - title: Security
      labels:
        - security
    - title: Maintenance
      labels:
        - type:ci
        - type:chore
        - type:task
        - type:style
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Tests
      labels:
        - type:test
    - title: Other Changes
      labels:
        - "*"
