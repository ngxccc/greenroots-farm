# .github/labeler.yml - `area:*` labels by monorepo workspace (v5 schema).
#
# Only "where" lives here. "What" — `type:*` — comes from the pull request's
# conventional-commit prefix, set by the `type` job in labels.yml.

"area:api":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/**/*"

"area:storefront":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/storefront/**/*"

"area:backoffice":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backoffice/**/*"

"area:shared":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/shared/**/*"

"area:ui":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/ui/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - ".husky/**/*"
          - "scripts/**/*"
          - "package.json"
          - "bun.lock"
          - "tsconfig*.json"
          - "docker-compose.yml"
          - ".syncpackrc"
          - ".oxlintrc.json"
          - ".oxfmtrc.json"
          - ".lintstagedrc.json"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
