# .github/labeler.yml - `area:*` labels by monorepo workspace (v5 schema).
#
# Only "where" lives here. "What" — `type:*` — comes from the pull request's
# conventional-commit prefix, set by the `type` job in labels.yml.

"area:api":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/**/*"

# `apps/*/src/types/api-schema.d.ts` is a generated contract refreshed by
# `bun run types:sync`. An API-only change that regenerates the client types is
# not a consumer change, so each frontend label requires at least one changed
# file outside that generated path. `all-globs-to-any-file` means "some changed
# file matches every glob", which keeps the exclusion per-file instead of
# dropping the label whenever the generated file appears in the pull request.
"area:storefront":
  - all:
      - changed-files:
          - all-globs-to-any-file:
              - "apps/storefront/**/*"
              - "!apps/storefront/src/types/api-schema.d.ts"

"area:backoffice":
  - all:
      - changed-files:
          - all-globs-to-any-file:
              - "apps/backoffice/**/*"
              - "!apps/backoffice/src/types/api-schema.d.ts"

"area:shared":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/shared/**/*"

"area:ui":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/ui/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - ".husky/**/*"
          - "scripts/**/*"
          - "package.json"
          - "bun.lock"
          - "tsconfig*.json"
          - "docker-compose.yml"
          - ".syncpackrc"
          - ".oxlintrc.json"
          - ".oxfmtrc.json"
          - ".lintstagedrc.json"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
