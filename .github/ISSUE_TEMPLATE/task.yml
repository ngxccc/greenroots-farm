name: "Task / Chore / Maintenance"
description: "Work item for chore, refactor, task, docs, or dependency updates"
title: "task(<scope>): <summary>"
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Track a planned engineering task, chore, refactoring, dependency update, or documentation work.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: "One-sentence observable behavior or state when complete (not a file inventory)."
      placeholder: "e.g. All apps consume shared enums from @greenroots/shared instead of redeclaring status values."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Background, current problem, discrepancy, or rationale."
      placeholder: "e.g. Order status strings are duplicated between the API and backoffice."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Checklist of measurable conditions required for completion."
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: "Explicit non-goals to prevent scope creep."
      placeholder: "e.g. Do not rename the GitHub repository (ngxccc/greenroots-farm)."
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Work Type
      description: "Select the Conventional Commits work type."
      options:
        - "type:task"
        - "type:chore"
        - "type:refactor"
        - "type:docs"
        - "type:perf"
        - "type:test"
        - "type:ci"
        - "type:style"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Select the primary domain."
      options:
        - "area:api (NestJS backend, schemas, migrations, domain modules)"
        - "area:storefront (Next.js customer storefront)"
        - "area:backoffice (React + Vite internal operations console)"
        - "area:shared (shared enums, constants, Haversine, JSONB, labels)"
        - "area:ui (shared Shadcn Base UI primitives & design tokens)"
        - "area:ci (GitHub Actions, Husky hooks, root configs, scripts)"
        - "area:docs (documentation, ADRs, glossaries, standards)"
    validations:
      required: true
